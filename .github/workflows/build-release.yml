name: Build and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build single-file EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.11,<7"
          pyinstaller --noconfirm --clean --onefile --windowed --name RapfiGomoku --add-data "engine;engine" run.py
          Move-Item dist/RapfiGomoku.exe dist/RapfiGomoku-Windows-x64.exe
          $process = Start-Process -FilePath dist/RapfiGomoku-Windows-x64.exe -ArgumentList "--engine-smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen Rapfi smoke test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/RapfiGomoku-Windows-x64.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.74"
          actions-cache-folder: emsdk-cache
      - name: Test mobile application
        run: |
          python3 tools/check_mobile_assets.py
          node tests/test_mobile_ai.mjs
      - name: Build Rapfi WebAssembly
        shell: bash
        run: bash scripts/build-rapfi-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rapfiengine
          path: ios/DouYi/Web/engine
          if-no-files-found: error
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DouYi-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: DouYi-Android.apk
          if-no-files-found: error

  ios:
    name: iPhone Simulator App
    needs: android
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rapfiengine
          path: ios/DouYi/Web/engine
      - name: Build iPhone Simulator app
        run: |
          xcodebuild \
            -project ios/DouYi.xcodeproj \
            -scheme DouYi \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package Simulator app
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Release-iphonesimulator/DouYi.app DouYi-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: DouYi-iOS-Simulator.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.exe *.apk *.zip > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "斗弈 · Rapfi 五子棋 ${GITHUB_REF_NAME}" --generate-notes --verify-tag
