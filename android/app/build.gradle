plugins {
    id "com.android.application"
}

android {
    namespace "com.mrdouzheng.rapfigomoku"
    compileSdk 35

    defaultConfig {
        applicationId "com.mrdouzheng.rapfigomoku"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // Produces an immediately installable APK. A stable private signing
            // key can replace this config before a Play Store publication.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
