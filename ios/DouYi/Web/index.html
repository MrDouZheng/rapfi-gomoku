<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101416">
  <title>斗弈 · Rapfi 五子棋</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand-mark"><i></i><i></i><i></i></div>
      <div><h1>斗弈</h1><p>RAPFI GOMOKU</p></div>
      <div id="engineBadge" class="badge loading"><span></span>引擎加载中</div>
    </header>

    <section class="mode-card">
      <button id="singleMode" class="selected">单人对战</button>
      <button id="doubleMode">双人对战</button>
      <div id="colorPicker" class="color-picker">
        <span>我的棋色</span>
        <button id="blackColor" class="selected">● 黑</button>
        <button id="whiteColor">○ 白</button>
      </div>
    </section>

    <section class="board-card">
      <canvas id="board" aria-label="十五路五子棋棋盘"></canvas>
    </section>

    <section class="status-card">
      <div><small id="statusKicker">轮到你了</small><strong id="statusTitle">黑方落子</strong></div>
      <div class="metrics"><span><b id="moveCount">0</b> 手</span><span id="timer">00:00</span></div>
    </section>

    <section class="actions">
      <button id="undoButton">悔棋</button>
      <button id="newButton" class="primary">新对局</button>
    </section>
    <footer>Copyright © 2026 MrDouZheng and contributors · GPL-3.0</footer>
    <div id="toast" role="status"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
